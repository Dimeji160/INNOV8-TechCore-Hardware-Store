 <!DOCTYPE html>
 <html lang="en">
 <head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Checkout</title>

 <link rel="stylesheet" href="style.css">
 </head>
 <body>

 <!--CHECKOUT-->
 <section id="checkout" class="checkout">
 <h2>CHECKOUT</h2>
 <form id="checkout-form">
 <!--FULL NAME-->
 <div class="form-group">
 <label for="fullname">FullName:</label>
 <input type="text" id="fullname" placeholder=" Enter your full name" required>
 </div>

 <!--EMAIL-->
 <div class="form-group">
 <label for="email">Email:</label>
 <input type="email" id="email" placeholder=" Enter your email" required>
 </div>

 <!--PHONE NUMBER-->
 <div class="form-group">
 <label for="phone">Phone Number:</label>
 <input type="tel" id="phone" placeholder=" Enter your phone number" required>
 </div>

 <!--ADDRESS-->
 <div class="form-group">
 <label for="address">Address:</label>
 <input type="text" id="address" placeholder=" Enter your deliveryaddress" required>
 </div>

 <!--STATE-->
 <div class="form-group">
 <label for="state">State:</label>
 <input type="text" id="state" placeholder=" Enter your state" required>
 </div>

  <!--Deliver Location-->
 <div class="form-group">
 <label for="delivery-location">Delivery Location</label>
 <select id="delivery-location" required>
 <option value="">Select delivery location</option>
 <option value="1000">Abuja - ₦1000</option>
 <option value="3000">Lagos - ₦3000</option>
 <option value="5000">other location - ₦5000</option>
 </select>
 </div>

 <!--PAYMENT-->
 <div class="payment">
 <h3>Payment Method</h3>
 <label>
 <input type="radio" name="payment"value="credit-card" required>Bank Transfer
 </label>
 <label>
 <input type="radio" name="payment" value="paypal" required>Card Payment
 </label>
 </div>

 <!--ORDER SUMMARY-->
 <div class="order-summary">
 <h3>Order Summary</h3>
 <div id="checkout-items"></div>
 <p>Subtotal: <span id="checkout-subtotal">₦0</span></p>
 <p>Delivery: <span id="checkout-delivery">₦0</span></p>
 <h3>Total: <span id="order-total">₦0</span></h3>
 </div>
 <button type="submit"class="btn">Place Order</button>
 </form> 
 </section>
 </body>
 </html>

 <script src="script.js" defer></script>
